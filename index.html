<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100e19" />
    <title>Corridor Rush — Arcade Runner</title>
    <link rel="icon" href="./signal.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/src/assets/interface/rush-night.webp" media="(orientation: landscape)" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/assets/interface/rush-night-portrait.webp" media="(orientation: portrait)" fetchpriority="high" />
  </head>
  <body style="margin:0;background:#100e19">
    <div id="app">
      <picture aria-hidden="true" style="position:fixed;inset:0;display:block;background:#100e19">
        <source media="(orientation: portrait)" srcset="/src/assets/interface/rush-night-portrait.webp" />
        <img src="/src/assets/interface/rush-night.webp" alt="" fetchpriority="high" style="display:block;width:100%;height:100%;object-fit:fill" />
      </picture>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
